<!DOCTYPE html>
<html lang="en">
<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
	<meta name="color-scheme" content="light dark">
	<script>
		// Pre-paint theme: mirrors the app's stored override so native UI and the first paint match.
		try {
			var pref = localStorage.getItem('characterCurioColorScheme');
			var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
			var root = document.documentElement;
			root.setAttribute('data-theme', dark ? 'dark' : 'light');
			root.classList.toggle('theme-dark', dark);
			document.querySelector('meta[name="color-scheme"]').content = pref === 'dark' || pref === 'light' ? pref : 'light dark';
		} catch (e) {}
	</script>
	<title>Character Curio</title>

	<!-- GOOGLE FONTS -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Open+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500;1,700&family=Alegreya+Sans+SC:wght@400;500;800;900&family=Roboto:wght@400;500;700;900&display=swap">

	<!-- FONT AWESOME -->
	<style>
		@font-face {
			font-family: 'Font Awesome 6 Free';
			font-style: normal;
			font-weight: 900;
			font-display: block;
			src: url('fonts/fa-solid-subset.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Font Awesome 6 Free';
			font-style: normal;
			font-weight: 400;
			font-display: block;
			src: url('fonts/fa-regular-subset.woff2') format('woff2');
		}
		@font-face {
			font-family: 'Font Awesome 6 Brands';
			font-style: normal;
			font-weight: 400;
			font-display: block;
			src: url('fonts/fa-brands-subset.woff2') format('woff2');
		}
	</style>

	<!-- CSS -->
	<link rel="stylesheet" href="css/app.min.css?v=f0df4da56e">

	<!-- FAVICON -->
	<link rel="icon" type="image/png" href="images/favicon.ico">
	<link rel="shortcut icon" type="image/png" href="images/favicon.ico">
	<link rel="apple-touch-icon-precomposed" href="images/favicon.ico">
	<meta name="msapplication-TileImage" content="images/favicon.ico">

</head>
<body>

<article id="character-curio"></article>

<script src="js/app.min.js?v=45e1598655"></script>

</body>
</html>
