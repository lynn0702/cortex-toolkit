<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
	<meta name="color-scheme" content="light dark">
	<script>
		// Pre-paint theme: mirrors the app's stored override so native UI and the first paint match.
		try {
			var pref = localStorage.getItem('characterCurioColorScheme');
			var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
			var root = document.documentElement;
			root.setAttribute('data-theme', dark ? 'dark' : 'light');
			root.classList.toggle('theme-dark', dark);
			document.querySelector('meta[name="color-scheme"]').content = pref === 'dark' || pref === 'light' ? pref : 'light dark';
		} catch (e) { }
	</script>
	<title>Character Curio</title>

	<!-- FONTS -->
	<link rel="stylesheet" href="css/fonts.css">

	<!-- CSS -->
	<link rel="stylesheet" href="css/app.min.css">

	<!-- FAVICON -->
	<link rel="icon" type="image/png" href="images/favicon.ico">
	<link rel="shortcut icon" type="image/png" href="images/favicon.ico">
	<link rel="apple-touch-icon-precomposed" href="images/favicon.ico">
	<meta name="msapplication-TileImage" content="images/favicon.ico">

</head>

<body>

	<div id="character-curio"></div>

	<script src="js/app.min.js"></script>

</body>

</html>
